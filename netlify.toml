[build]
  command = "npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Scheduled function - runs daily at 3 AM UTC
[[scheduled_functions]]
  name = "daily-scraper"
  schedule = "0 3 * * *"
  
# Timeout for functions (max 26 seconds on free tier)
[functions."*"]
  timeout = 26
